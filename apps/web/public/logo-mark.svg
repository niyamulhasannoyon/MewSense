<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Outer Tech Geometric Radar Circle -->
  <circle cx="256" cy="270" r="180" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Cat Head Geometric Contour (Stylized Vector) -->
  <path d="M 120 130 
           L 185 210 
           L 327 210 
           L 392 130 
           L 370 270 
           L 320 380 
           L 256 420 
           L 192 380 
           L 142 270 Z" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Cat Ears Inner Accents -->
  <path d="M 145 160 L 180 205 L 155 240 Z" fill="url(#amberGlow)" opacity="0.85"/>
  <path d="M 367 160 L 332 205 L 357 240 Z" fill="url(#amberGlow)" opacity="0.85"/>

  <!-- Central Audio DSP Soundwave Frequency Spectrum Bars inside Cat Face -->
  <!-- Bar 1 (Left Far) -->
  <rect x="180" y="275" width="12" height="45" rx="6" fill="url(#cyanGlow)"/>
  <!-- Bar 2 -->
  <rect x="202" y="250" width="12" height="85" rx="6" fill="url(#emeraldGlow)"/>
  <!-- Bar 3 -->
  <rect x="224" y="230" width="12" height="115" rx="6" fill="url(#amberGlow)" filter="url(#subtleGlow)"/>
  <!-- Bar 4 (Center Apex - Highest Frequency Peak) -->
  <rect x="246" y="210" width="14" height="150" rx="7" fill="url(#amberGlow)" filter="url(#glow)"/>
  <!-- Bar 5 -->
  <rect x="270" y="230" width="12" height="115" rx="6" fill="url(#amberGlow)" filter="url(#subtleGlow)"/>
  <!-- Bar 6 -->
  <rect x="292" y="250" width="12" height="85" rx="6" fill="url(#emeraldGlow)"/>
  <!-- Bar 7 (Right Far) -->
  <rect x="314" y="275" width="12" height="45" rx="6" fill="url(#cyanGlow)"/>

  <!-- Horizontal Frequency Zero-Cross Line -->
  <line x1="165" y1="295" x2="347" y2="295" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="4 4"/>

  <!-- Whisker Bioacoustic Radar Rays -->
  <!-- Left Whiskers -->
  <path d="M 160 305 L 90 285" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 155 325 L 85 320" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 160 345 L 95 355" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Right Whiskers -->
  <path d="M 352 305 L 422 285" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 357 325 L 427 320" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 352 345 L 417 355" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Nose / Node AI Core Pulsing Diamond -->
  <polygon points="256,368 266,378 256,388 246,378" fill="#06b6d4" filter="url(#subtleGlow)"/>
</svg>
